name: Phase 5 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source and Git LFS workbooks
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            constraints.txt

      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -c constraints.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src tests tools

      - name: Run complete offline suite with warnings as errors
        run: python -W error -m pytest -q

      - name: Verify checked-in core distribution
        run: python tools/verify_distribution.py data/exports
